[package]
name = "avail-cli"
version = "0.2.0"
edition = "2024"
authors = ["Akinori Musha <knu@idaemons.org>"]
default-run = "avail"
description = "Check tool name availability and uniqueness"
license = "MIT"
repository = "https://github.com/knu/avail"
readme = "README.md"
keywords = ["availability", "cli", "registry"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.release]
publish = false
push = false
pre-release-commit-message = "Bump version to {{version}}"
tag-message = "Release version {{version}}"

[[bin]]
name = "avail"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.29", default-features = false }
tempfile = "3"
ureq = { version = "3", features = ["json"] }
url = "2"
wait-timeout = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
